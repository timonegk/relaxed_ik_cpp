relaxed_ik:
  opt_solver: {
    type: string,
    default_value: LD_SLSQP,
    description: "Optimization solver from NLOPT. Default is LD_SLSQP.",
  }
  epsilon: {
    type: double,
    default_value: 0.00001,
    description: "Threshold for solution twist diff. Default is 1e-5.",
    validation: {
      gt_eq<>: [0.0],
    }
  }
